    return () => io.disconnect();

// Counts from 0 up to `target` once `run` becomes true
function useCountUp(target, run, ms = 1500) {
  const [v, setV] = useState(0);
  useEffect(() => {
    if (!run) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { setV(target); return; }
    let raf, t0;
    const step = t => {
      t0 = t0 || t;
      const p = Math.min((t - t0) / ms, 1);
      setV(target * (1 - Math.pow(1 - p, 3)));
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [run]);
  return v;
}

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { from.current = target; setV(target); return; }
    const start = from.current;
    let raf, t0;
    const step = t => {
      t0 = t0 || t;
      const p = Math.min((t - t0) / ms, 1);
      from.current = start + (target - start) * (1 - Math.pow(1 - p, 3));
      setV(from.current);
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return v;
}
// true shortly after mount, so bars and rings can animate from empty

  const [r, setR] = useState(false);

}

function RevenueChart({ p }) {
  const [hov, setHov] = useState(null);
  const act = ACT.map(v => v * p.s), fc = FC.map(v => v * p.s), all = [...act, ...fc];
  const max = Math.ceil(Math.max(...all) * 1.1 * 2) / 2;
  const W = 600, H = 190, x0 = 56, n = all.length, step = (W - x0 - 8) / (n - 1);
  const X = i => x0 + i * step, Y = v => 8 + H - (v / max) * H;
  const path = (arr, off) => arr.map((v, i) => (i ? 'L' : 'M') + X(i + off).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
  const area = path(act, 0) + ' L' + X(11) + ' ' + (8 + H) + ' L' + X(0) + ' ' + (8 + H) + ' Z';
  const move = e => {
    const r = e.currentTarget.getBoundingClientRect();
    setHov(Math.max(0, Math.min(n - 1, Math.round((((e.clientX - r.left) / r.width) * W - x0) / step))));
  };
  return (
    <Card title="Revenue growth and forecast" tag="Live trajectory" right={hov === null ? 'Hover to inspect' : MONTHS[hov] + ': ' + money(all[hov]) + (hov > 11 ? ' (forecast)' : '')}>

        {[0, 1, 2, 3, 4].map(k => { const v = (max * k) / 4, y = Y(v); return <g key={k}><line x1={x0} x2={W - 8} y1={y} y2={y} stroke="#E1E7F5" strokeDasharray="3 4" /><text x="0" y={y + 5} fontSize="15" fill="#6B7699">{'$' + v.toFixed(1) + 'M'}</text></g>; })}

    </Card>
  );

function useLive(base, min, max, ms) {
  const [v, setV] = useState(base);

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  return useTween(v, Math.min(ms, 900));
}

// Renders its children only when they are close to the screen, so phones load the top of the page first
function Lazy({ id, minH = 600, children }) {
  const ref = useRef(null);
  const [on, setOn] = useState(false);
  useEffect(() => {
    if (!('IntersectionObserver' in window)) { setOn(true); return; }
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setOn(true); io.disconnect(); } }, { rootMargin: '700px' });
    io.observe(ref.current);
    const fallback = setTimeout(() => setOn(true), 3500);
    return () => { io.disconnect(); clearTimeout(fallback); };
  }, []);
  return <div id={id} ref={ref} style={on ? undefined : { minHeight: minH }}>{on ? children : null}</div>;
}

function MrrChart({ p }) {
  const ready = useReady();
  const mrr = ACT.map(v => (v * p.s * 1000) / 12);
  const max = Math.ceil((Math.max(...mrr) * 1.1) / 50) * 50;
  const W = 600, x0 = 48, top = 10, H = 200, band = (W - x0 - 6) / 12;
  const X = i => x0 + band * (i + 0.5), Y = v => top + H - (v / max) * H;
  const line = mrr.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
  return (
    <Card title="Monthly recurring revenue growth" tag="Last 12 months" right={'Current MRR $' + Math.round(mrr[11] * 1000).toLocaleString('en-US')}>
      <svg viewBox="0 0 600 250" className="w-full" role="img" aria-label="Monthly recurring revenue rising over twelve months">
        {[0, 1, 2, 3, 4].map(k => { const v = (max * k) / 4; return <g key={k}><line x1={x0} x2={W - 6} y1={Y(v)} y2={Y(v)} stroke="#E1E7F5" strokeDasharray="3 4" /><text x="0" y={Y(v) + 5} fontSize="14" fill="#6B7699">{'$' + Math.round(v) + 'k'}</text></g>; })}
        {mrr.map((v, i) => {
          const b = v * 0.7, u = v * 0.24, w = band * 0.6, x = X(i) - w / 2;
          return (
            <g key={i} style={{ transformBox: 'fill-box', transformOrigin: 'bottom', transform: ready ? 'scaleY(1)' : 'scaleY(0)', transition: 'transform .9s ease ' + i * 60 + 'ms' }}>
              <rect x={x} y={Y(b)} width={w} height={Y(0) - Y(b)} fill="#7DD3F5" />
              <rect x={x} y={Y(b + u)} width={w} height={Y(b) - Y(b + u)} fill="#3D9BE9" />
              <rect x={x} y={Y(v)} width={w} height={Y(b + u) - Y(v)} fill="#F2A33A" />
            </g>
          );
        })}
        <path d={line} pathLength="1" fill="none" stroke="#0F2A5C" strokeWidth="2.5" strokeLinejoin="round" className="drawin" />
        {mrr.map((v, i) => <circle key={i} cx={X(i)} cy={Y(v)} r="4.5" fill="#fff" stroke="#0F2A5C" strokeWidth="2.5" className="fadein" />)}

// Works out how much to shrink the 1048 wide drawing so it fits its box
function useFit(w) {
  const ref = useRef(null);
  const [k, setK] = useState(0.6);
  useEffect(() => {
    const el = ref.current;
    const update = () => setK(Math.min(el.clientWidth / w, 1.1));
    update();
    if (!('ResizeObserver' in window)) { window.addEventListener('resize', update); return () => window.removeEventListener('resize', update); }
    const ro = new ResizeObserver(update);
    ro.observe(el);
    return () => ro.disconnect();
  }, []);
  return [ref, k];
}

function Automation() {

    const t = setInterval(() => setStep(s => (s + 1) % 10), 1300);
    return () => clearInterval(t);
  }, []);
  const runs = useLive(1284, 1, 3, 1500), saved = useLive(420, 1, 3, 2200);
  const finished = step >= 8, now = FLOW[Math.min(step, 7)];
  return (
    <section className="bg-mist py-20">
      <div className="mx-auto max-w-6xl px-5">
        <Reveal className="mx-auto max-w-2xl text-center">

            <ol className="space-y-2 p-3">
              {FLOW.map((n, i) => (
                <li key={n.label} className={'flex items-center gap-3 rounded-xl border p-3 transition-all duration-500 ' + (i === step ? 'border-azure bg-azure text-white' : i < step ? 'border-[#16B67A]/50 bg-white' : 'border-line bg-white')}>

                  <span className="min-w-0 flex-1 text-sm font-bold leading-tight">{n.label}<span className={'block text-xs font-medium ' + (i === step ? 'text-white/85' : 'text-navy-900/75')}>{n.sub}</span></span>
                  {i < step && <span className="flex h-6 w-6 items-center justify-center rounded-full bg-[#16B67A] text-white">{checkIcon}</span>}

      </div>
    </section>
  );
}


// Fades and slides its children in when they scroll into view
function Reveal({ children, delay = 0, className = '' }) {
  const [ref, seen] = useInView();
  return <div ref={ref} className={'reveal ' + (seen ? 'in ' : '') + className} style={{ transitionDelay: delay + 'ms' }}>{children}</div>;
}

// Swaps the headline phrase every few seconds (stays still for people who prefer less motion)
function Rotator({ words }) {
  const [i, setI] = useState(0);
  useEffect(() => {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const t = setInterval(() => setI(n => (n + 1) % words.length), 2800);
    return () => clearInterval(t);
  }, []);
  return <span key={i} className="swap block text-mint">{words[i]}</span>;
}

function Contact() {
  const [form, setForm] = useState({ name: '', email: '', message: '' });
  const [errors, setErrors] = useState({});
  const [sent, setSent] = useState(false);
  const update = e => setForm({ ...form, [e.target.name]: e.target.value });
  const submit = e => {
    e.preventDefault();
    const found = {};
    if (!form.name.trim()) found.name = 'Enter your name.';
    if (!/^\S+@\S+\.\S+$/.test(form.email)) found.email = 'Enter a valid email, like you@company.com.';
    if (form.message.trim().length < 10) found.message = 'Tell us a little more (at least 10 characters).';
    setErrors(found);
    // Demo only: to send real messages, post `form` to your backend or a form service here.
    if (!Object.keys(found).length) setSent(true);
  };
  const field = 'mt-2 w-full rounded-lg border bg-white px-4 py-3 placeholder:text-navy-900/40 focus:border-azure focus:outline-none focus:ring-2 focus:ring-azure/30 ';
  return (
    <section id="contact" className="bg-white py-20">
      <div className="mx-auto grid max-w-6xl gap-12 px-5 lg:grid-cols-2">
        <div>
          <h2 className="text-3xl font-extrabold leading-tight sm:text-4xl">Talk to a person, not a chatbot.</h2>
          <p className="mt-4 max-w-md text-navy-900/85">Tell us about your team and we’ll reply within one business day with a tailored walkthrough.</p>
          <p className="mt-8 text-sm text-navy-900/75">Email</p><p className="font-bold">hello@nexora.example</p>
          <p className="mt-4 text-sm text-navy-900/75">Support hours</p><p className="font-bold">Monday to Friday, 8am to 6pm</p>
        </div>
        <div className="rounded-xl border border-line bg-mist p-6 sm:p-8">
          {sent ? (
            <div role="status" className="py-8 text-center">
              <span className="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-azure text-white"><Icon d="M5 12.5l4.5 4.5L19 7" className="h-7 w-7" /></span>
              <h3 className="mt-5 text-2xl font-extrabold">Message sent</h3>
              <p className="mt-2 text-navy-900/85">Thanks, {form.name.split(' ')[0]}. We’ll reply to {form.email} soon.</p>
              <button onClick={() => { setSent(false); setForm({ name: '', email: '', message: '' }); }} className={btn + ' mt-6'}>Send another message</button>
            </div>
          ) : (
            <form onSubmit={submit} noValidate className="space-y-5">
              {[['name', 'Full name', 'text', 'Jordan Lee'], ['email', 'Work email', 'email', 'you@company.com']].map(([k, label, type, ph]) => (
                <div key={k}>
                  <label htmlFor={k} className="text-sm font-bold">{label}</label>
                  <input id={k} name={k} type={type} value={form[k]} onChange={update} placeholder={ph} aria-invalid={!!errors[k]} className={field + (errors[k] ? 'border-red-500' : 'border-line')} />
                  {errors[k] && <p className="mt-1.5 text-sm text-red-600">{errors[k]}</p>}
                </div>
              ))}
              <div>
                <label htmlFor="message" className="text-sm font-bold">How can we help?</label>
                <textarea id="message" name="message" rows="4" value={form.message} onChange={update} placeholder="We have 20 sellers and track deals in three tools…" aria-invalid={!!errors.message} className={field + (errors.message ? 'border-red-500' : 'border-line')} />
                {errors.message && <p className="mt-1.5 text-sm text-red-600">{errors.message}</p>}
              </div>
              <button type="submit" className={btn + ' w-full'}>Send message</button>
            </form>
          )}
        </div>
      </div>
    </section>
  );
}
